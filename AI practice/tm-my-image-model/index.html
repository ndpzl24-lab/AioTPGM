<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 판독기 (음성지원)</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        #webcam-container {
            margin: 0 auto;
            border: 5px solid #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            width: 200px;
            height: 200px;
            background-color: #eee;
        }
        button {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            width: 100%;
        }
        #label-container {
            margin-top: 1.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: #4f46e5;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🤖 AI 음성 판독기</h2>
    <div id="webcam-container"></div>
    <button type="button" onclick="init()">AI 카메라 시작</button>
    <div id="label-container">준비 완료</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    // 티쳐블 머신 모델 경로 (본인의 경로로 수정 확인)
    const URL = "./my_model/";
    
    let model, webcam, labelContainer, maxPredictions;
    let lastResult = ""; // 중복 음성 방지용

    // 음성 출력 함수
    function speak(text) {
        // 브라우저 음성 합성 초기화
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        window.speechSynthesis.speak(utterance);
    }

    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // 버튼 상태 변경
        document.querySelector("button").innerHTML = "분석 중...";
        
        // 모델 로드
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // 웹캠 설정
        const flip = true;
        webcam = new tmImage.Webcam(200, 200, flip);
        await webcam.setup();
        await webcam.play();
        window.requestAnimationFrame(loop);

        // 화면에 웹캠 붙이기
        document.getElementById("webcam-container").innerHTML = ""; // 초기화
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
    }

    async function loop() {
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        let currentResult = "";

        // 확률이 85% 이상일 때만 동작하도록 설정 (안정적)
        if(prediction[0].probability >= 0.5) {
            currentResult = "주먹";
            labelContainer.innerHTML = `<span class="status-dot"></span> ✊ 주먹!`;
        } else if(prediction[1].probability >= 0.5) {
            currentResult = "보자기";
            labelContainer.innerHTML = `<span class="status-dot"></span> 🖐️ 보자기!`;
        } else {
            currentResult = "대기";
            labelContainer.innerHTML = "🤔 관찰 중...";
        }

        // 결과가 바뀌었을 때만 음성 실행
        if (currentResult !== lastResult && currentResult !== "대기") {
            speak(currentResult);
            lastResult = currentResult;
        } else if (currentResult === "대기") {
            lastResult = ""; // 관찰 중일 때는 초기화
        }
    }
</script>

</body>
</html>
