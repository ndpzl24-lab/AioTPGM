<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 박수 반응기</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #0f172a; /* 어두운 배경 */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #clap-emoji {
            font-size: 10rem;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.3;
            filter: grayscale(1);
        }

        /* 박수 칠 때 활성화될 스타일 */
        #clap-emoji.active {
            opacity: 1;
            filter: grayscale(0);
            transform: scale(1.3);
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
        }

        .info {
            margin-top: 2rem;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        #status {
            margin-top: 1rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="clap-emoji">👏</div>

    <div class="info">
        <button id="start-btn" onclick="init()">AI 박수 탐지 시작</button>
        <p id="status">박수를 치면 이모티콘이 반응합니다!</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        // 1. 본인의 티쳐블 머신 모델 URL로 교체하세요!
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/";

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            const recognizer = speechCommands.create(
                "BROWSER_FFT",
                undefined,
                checkpointURL,
                metadataURL);

            await recognizer.ensureModelIsLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels();
            const emoji = document.getElementById("clap-emoji");
            const status = document.getElementById("status");
            const btn = document.getElementById("start-btn");

            btn.style.display = "none";
            status.innerText = "🎤 마이크가 활성화되었습니다. 박수를 쳐보세요!";

            recognizer.listen(result => {
                const scores = result.scores;
                let maxScore = 0;
                let maxIndex = 0;

                for (let i = 0; i < classLabels.length; i++) {
                    if (scores[i] > maxScore) {
                        maxScore = scores[i];
                        maxIndex = i;
                    }
                }

                // 학습시킨 클래스 이름이 'Clap' 또는 '박수'인 경우
                const detectedWord = classLabels[maxIndex];

                if (maxScore > 0.85 && (detectedWord === "Clap" || detectedWord === "박수")) {
                    // 효과 부여
                    emoji.classList.add("active");
                    status.innerText = "👏 박수 소리 감지!!";
                    
                    // 0.2초 뒤에 원래대로 복구
                    setTimeout(() => {
                        emoji.classList.remove("active");
                        status.innerText = "듣고 있는 중...";
                    }, 200);
                }
            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50 
            });
        }
    </script>
</body>
</html>
